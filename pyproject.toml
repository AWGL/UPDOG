[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "pyupdog"
version = "1.2.4"
description = "Python program for calculating UPD"
readme = "readme.md"
requires-python = ">=3.11"
authors = [{ name = "Joseph Halstead", email = "josephhalstead89@gmail.com" }]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]
dependencies = [
    "pysam>=0.22.1",
    "pandas>=2.2",
    "numpy",
    "matplotlib",
    "seaborn>=0.13",
    "scipy>=1.14",
    "pyvariantfilter>=2.1.0",
]

[project.urls]
Homepage = "https://github.com/AWGL/UPDOG"

[tool.setuptools]
# UPDog.py is a top level script rather than an entry point - installed onto PATH as-is so pipelines can call UPDog.py
script-files = ["UPDog.py"]

[tool.setuptools.packages.find]
include = ["upd*"]
